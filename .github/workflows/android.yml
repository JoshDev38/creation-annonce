name: Appli Android

on:
  push:
    branches: [claude/friendly-cray-p8qvsx, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire le site
        run: |
          npm ci
          npm run build

      - name: Copier le site dans l'appli Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nalow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nalow-apk
          path: nalow.apk

      # Lien fixe, sans zip ni compte GitHub :
      # https://github.com/JoshDev38/creation-annonce/releases/download/derniere-version/nalow.apk
      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view derniere-version >/dev/null 2>&1 || \
            gh release create derniere-version --title "Malow – dernière version" \
              --notes "APK de test Android, reconstruit à chaque modification." --prerelease
          gh release upload derniere-version nalow.apk --clobber
